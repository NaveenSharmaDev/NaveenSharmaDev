<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Naveen Kumar Sharma — animated 3D developer banner</title>
  <desc id="desc">An animated neon 3D banner for a Python, MERN, and AI developer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d22" />
      <stop offset="48%" stop-color="#162454" />
      <stop offset="100%" stop-color="#5b258e" />
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73f5ff" />
      <stop offset="100%" stop-color="#5f58ff" />
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d7cbb" />
      <stop offset="100%" stop-color="#10255f" />
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e4ad8" />
      <stop offset="100%" stop-color="#32146b" />
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#7cf5ff" />
      <stop offset="100%" stop-color="#6d28d9" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7dd3fc" stroke-opacity=".12" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#background)" />
  <rect width="1200" height="320" rx="22" fill="url(#grid)" opacity=".65" />
  <ellipse cx="885" cy="280" rx="340" ry="44" fill="#090d22" opacity=".52" />

  <g opacity=".72">
    <circle cx="80" cy="48" r="2" fill="#b8faff"><animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite" /></circle>
    <circle cx="500" cy="59" r="3" fill="#b8faff"><animate attributeName="opacity" values="1;.15;1" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="1115" cy="86" r="2" fill="#b8faff"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" repeatCount="indefinite" /></circle>
  </g>

  <g transform="translate(72 72)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="72 72;72 59;72 72" dur="4.2s" repeatCount="indefinite" />
    <polygon points="0,46 67,8 134,46 67,84" fill="url(#top)" />
    <polygon points="0,46 67,84 67,166 0,128" fill="url(#left)" />
    <polygon points="134,46 67,84 67,166 134,128" fill="url(#right)" />
    <path d="M17 45 L67 17 117 45 L67 73 Z" fill="none" stroke="#e0fbff" stroke-opacity=".7" />
  </g>

  <g transform="translate(955 44)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="955 44;955 61;955 44" dur="3.6s" repeatCount="indefinite" />
    <polygon points="0,30 44,5 88,30 44,55" fill="url(#top)" />
    <polygon points="0,30 44,55 44,109 0,84" fill="url(#left)" />
    <polygon points="88,30 44,55 44,109 88,84" fill="url(#right)" />
  </g>

  <g transform="translate(1015 188)">
    <circle cx="0" cy="0" r="29" fill="url(#orb)" filter="url(#glow)">
      <animate attributeName="cy" values="0;-15;0" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="-9" cy="-10" r="8" fill="#ffffff" fill-opacity=".72" />
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#f8fafc">
    <text x="260" y="112" font-size="16" font-weight="700" letter-spacing="4" fill="#72efff">HELLO, WORLD! I AM</text>
    <text x="260" y="164" font-size="43" font-weight="800">Naveen Kumar Sharma</text>
    <text x="260" y="202" font-size="19" fill="#d9d6fe">Python Developer  •  MERN Stack Developer</text>
    <text x="260" y="231" font-size="19" fill="#d9d6fe">AI &amp; Computer Vision Enthusiast</text>
  </g>

  <g transform="translate(260 260)">
    <rect width="182" height="32" rx="16" fill="#152e5c" stroke="#6ee7f9" stroke-opacity=".75" />
    <text x="91" y="21" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#bffbff">BUILD • LEARN • GROW</text>
  </g>

  <path d="M0 295 C170 256 245 333 424 291 S701 256 849 295 S1030 330 1200 274 L1200 320 L0 320 Z" fill="#0b102b" fill-opacity=".78">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 295 C170 256 245 333 424 291 S701 256 849 295 S1030 330 1200 274 L1200 320 L0 320 Z;M0 282 C150 332 280 255 424 295 S680 331 849 282 S1035 251 1200 294 L1200 320 L0 320 Z;M0 295 C170 256 245 333 424 291 S701 256 849 295 S1030 330 1200 274 L1200 320 L0 320 Z" />
  </path>
</svg>
